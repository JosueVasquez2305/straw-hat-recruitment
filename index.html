<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <h1>Recruitment Form: Straw Hat Crew</h1>

  <div class="container">

    <form>
        <label for="name">Pirate Name or Alias</label>
        <input type="text" id="name" required>

        <label for="email">Email (Den Den Mushi)</label>
        <input type="email" id="email" required>
      
        <label for="position">Position in the crew</label>

        <select id="position" required>
            <option value="" disabled selected>Select a position</option>
            <option value="swordsman">Swordsman</option>
            <option value="cook">Cook</option>
            <option value="navigator">Navigator</option>
            <option value="doctor">Doctor / Sniper</option>
        </select>

        <fieldset class="radio-group">
            <legend>Sailing Availability</legend>

          <input type="radio" id="calm-belt" name="availability" value="calm-belt">
          <label for="calm-belt">Calm Belt</label>

          <input type="radio" id="new-world" name="availability" value="new-world">
          <label for="new-world">New World</label>
        </fieldset>

        <label for="message">What is your dream?</label>
        <textarea id="message" required></textarea>

        <button type="submit">Join the King of Pirates!</button>
    </form>

  </div>
</body>
</html>
